<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Maker BD — ইনভয়েস মেকার বিডি</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar no-print">
  <div class="brand">
    <h1 data-i18n="appTitle">Invoice Maker BD</h1>
    <p data-i18n="appSub">Freelancer &amp; small-shop invoices, offline</p>
  </div>
  <div class="toolbar">
    <button id="btnLang" class="btn ghost" data-i18n="langToggle">বাংলা</button>
    <button id="btnNew" class="btn ghost" data-i18n="new">New</button>
    <button id="btnSample" class="btn ghost" data-i18n="sample">Load sample</button>
    <button id="btnSave" class="btn primary" data-i18n="save">Save invoice</button>
    <button id="btnPrint" class="btn primary" data-i18n="print">Print / PDF</button>
    <button id="btnExport" class="btn ghost" data-i18n="export">Export</button>
    <button id="btnImport" class="btn ghost" data-i18n="import">Import</button>
    <button id="btnClear" class="btn danger-ghost" data-i18n="clear">Clear all</button>
  </div>
</header>
<div id="toast" class="toast no-print" aria-live="polite"></div>

<main class="layout">
  <section class="editor">
    <div class="card">
      <h2 data-i18n="business">Your business</h2>
      <label><span data-i18n="bizName">Business name</span><input id="bizName" type="text" autocomplete="organization"></label>
      <label><span data-i18n="bizAddr">Address</span><textarea id="bizAddr" rows="2"></textarea></label>
      <div class="row2">
        <label><span data-i18n="bizPhone">Phone</span><input id="bizPhone" type="tel"></label>
        <label><span data-i18n="bizEmail">Email (optional)</span><input id="bizEmail" type="email"></label>
      </div>
      <div class="row2">
        <label><span data-i18n="logo">Logo (optional, stays in your browser)</span><input id="logoFile" type="file" accept="image/*"></label>
        <label><span data-i18n="invPrefix">Invoice prefix</span><input id="invPrefix" type="text" value="INV-" maxlength="10"></label>
      </div>
      <div id="logoRow" class="logo-row hidden">
        <img id="logoThumb" alt="logo">
        <button id="btnLogoRemove" class="btn danger-ghost small" data-i18n="removeLogo">Remove logo</button>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="client">Bill to (client)</h2>
      <label><span data-i18n="clientName">Client name</span><input id="clientName" type="text"></label>
      <label><span data-i18n="clientAddr">Client address</span><textarea id="clientAddr" rows="2"></textarea></label>
      <label><span data-i18n="clientPhone">Client phone (optional)</span><input id="clientPhone" type="tel"></label>
    </div>

    <div class="card">
      <h2 data-i18n="meta">Invoice details</h2>
      <div class="row3">
        <label><span data-i18n="invNo">Invoice no.</span><input id="invNo" type="text" readonly></label>
        <label><span data-i18n="issueDate">Issue date</span><input id="issueDate" type="date"></label>
        <label><span data-i18n="dueDate">Due date</span><input id="dueDate" type="date"></label>
      </div>
      <div class="row2">
        <label><span data-i18n="status">Status</span>
          <select id="invStatus">
            <option value="unpaid" data-i18n="unpaid">Unpaid</option>
            <option value="paid" data-i18n="paid">Paid</option>
          </select>
        </label>
        <p class="hint" data-i18n="autoNum">Next number auto-increments on save.</p>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="items">Items</h2>
      <div id="itemRows"></div>
      <button id="btnAddItem" class="btn ghost" data-i18n="addItem">+ Add item</button>
      <p id="itemError" class="error" aria-live="polite"></p>
    </div>

    <div class="card">
      <h2 data-i18n="grandTotal">Grand total</h2>
      <div class="row2">
        <label><span data-i18n="discount">Discount %</span><input id="discountPct" type="number" min="0" max="100" step="0.01" value="0"></label>
        <label><span data-i18n="vat">VAT %</span><input id="vatPct" type="number" min="0" max="100" step="0.01" value="0"></label>
      </div>
      <label><span data-i18n="notes">Notes (optional, shows on invoice)</span><textarea id="notes" rows="2" data-i18n-ph="notesPh" placeholder="e.g. Payment due within 7 days. bKash: 01XXXXXXXXX"></textarea></label>
    </div>
  </section>

  <section class="preview-wrap">
    <div id="invoiceSheet" class="sheet"><!-- rendered invoice --></div>
  </section>
</main>

<section class="history no-print">
  <h2 data-i18n="history">Saved invoices</h2>
  <div id="historyList"></div>
  <p id="historyEmpty" class="hint" data-i18n="noHistory">No saved invoices yet.</p>
</section>

<input id="importFile" type="file" accept="application/json,.json" class="hidden">

<script src="js/words.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
